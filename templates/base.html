{% load static %}<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} · Face Log</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'home' %}">Face Log</a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}">Profil</a>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost">Chiqish</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Kirish</a>
        <a href="{% url 'accounts:register' %}" class="btn btn-small">Ro'yxatdan o'tish</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
